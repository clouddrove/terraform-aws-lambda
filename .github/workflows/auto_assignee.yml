name: Auto Assign PRs

permissions:
  contents: read
  issues: write
  pull-requests: write
on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
jobs:
  assignee:
    uses: clouddrove/github-shared-workflows/.github/workflows/auto_assignee.yml@master
    secrets:
      GITHUB: ${{ secrets.GITHUB }}
    with:
      assignees: 'clouddrove-ci'
